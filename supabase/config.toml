project_id = "strongr-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.strongr-os-media]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["audio/wav"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
