name: M0.2 remote acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m0-2-remote-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: m0-2-acceptance

    env:
      STRONGR_OS_PROJECT_REF: fifrlyddmjkogmdvyjdp
      STRONGR_OS_REMOTE_ACCEPTANCE: strongr-os-dev
      STRONGR_OS_SOURCE_PROJECT_REF: fifrlyddmjkogmdvyjdp
      STRONGR_OS_RESTORE_PROJECT_REF: guovsmbtxuowyyqamaex
      STRONGR_OS_SOURCE_TARGET: strongr-os-dev
      STRONGR_OS_RESTORE_TARGET: strongr-os-disposable
      STRONGR_OS_RESTORE_CONFIRM: strongr-os-disposable-restore

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/m0-2-remote
          printf '{"test":"workflow_started","status":"pass","sha":"%s"}\n' \
            "$GITHUB_SHA" >artifacts/m0-2-remote/workflow.jsonl

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >>"$GITHUB_PATH"

      - name: Validate required secrets
        env:
          STRONGR_OS_SUPABASE_URL: ${{ secrets.STRONGR_OS_SUPABASE_URL }}
          STRONGR_OS_SUPABASE_ANON_KEY: ${{ secrets.STRONGR_OS_SUPABASE_ANON_KEY }}
          STRONGR_OS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STRONGR_OS_SUPABASE_SERVICE_ROLE_KEY }}
          STRONGR_OS_DATABASE_URL: ${{ secrets.STRONGR_OS_DATABASE_URL }}
          STRONGR_OS_RESTORE_DATABASE_URL: ${{ secrets.STRONGR_OS_RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in \
            STRONGR_OS_SUPABASE_URL \
            STRONGR_OS_SUPABASE_ANON_KEY \
            STRONGR_OS_SUPABASE_SERVICE_ROLE_KEY \
            STRONGR_OS_DATABASE_URL \
            STRONGR_OS_RESTORE_DATABASE_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

      - name: Apply repository migrations to disposable target
        env:
          STRONGR_OS_RESTORE_DATABASE_URL: ${{ secrets.STRONGR_OS_RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          evidence=artifacts/m0-2-remote/migrations.jsonl
          trap 'status=$?; if (( status != 0 )); then printf "{\"test\":\"repository_migrations\",\"status\":\"fail\",\"exit_code\":%d}\n" "$status" >>"$evidence"; fi' EXIT

          public_table_count="$(
            psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
              -X -qAt -v ON_ERROR_STOP=1 \
              -c "select count(*) from information_schema.tables
                  where table_schema = 'public'
                    and table_type = 'BASE TABLE'"
          )"
          migration_history_exists="$(
            psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
              -X -qAt -v ON_ERROR_STOP=1 \
              -c "select to_regclass(
                    'supabase_migrations.schema_migrations'
                  ) is not null"
          )"
          recorded_migration_count=0
          if [[ "$migration_history_exists" == "t" ]]; then
            recorded_migration_count="$(
              psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
                -X -qAt -v ON_ERROR_STOP=1 \
                -c "select count(*)
                    from supabase_migrations.schema_migrations"
            )"
          fi
          if [[ "$public_table_count" != "0" || "$recorded_migration_count" != "0" ]]; then
            printf '%s\n' \
              "ERROR: Disposable target must be clean before migrations are applied." >&2
            exit 1
          fi

          psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
            -X -v ON_ERROR_STOP=1 \
            <<'SQL'
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations (
            version text primary key,
            statements text[],
            name text
          );
          SQL

          migration_count=0
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            filename="$(basename "$migration" .sql)"
            version="${filename%%_*}"
            migration_name="${filename#*_}"

            psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
              -X -v ON_ERROR_STOP=1 --single-transaction \
              -v version="$version" \
              -v migration_name="$migration_name" \
              -f "$migration" -f - <<'SQL'
          insert into supabase_migrations.schema_migrations (
            version,
            statements,
            name
          )
          values (
            :'version',
            array[]::text[],
            :'migration_name'
          )
          ;
          SQL
            migration_count="$((migration_count + 1))"
            printf '{"test":"migration_applied","status":"pass","version":"%s","name":"%s"}\n' \
              "$version" "$migration_name" >>"$evidence"
          done

          recorded_count="$(
            psql "$STRONGR_OS_RESTORE_DATABASE_URL" \
              -X -qAt -v ON_ERROR_STOP=1 \
              -c "select count(*) from supabase_migrations.schema_migrations"
          )"
          if [[ "$recorded_count" != "$migration_count" ]]; then
            printf '%s\n' \
              "ERROR: Applied and recorded migration counts differ." >&2
            exit 1
          fi
          printf '{"test":"repository_migrations","status":"pass","count":%d}\n' \
            "$migration_count" >>"$evidence"

      - name: Run real strongr-os-dev acceptance
        env:
          STRONGR_OS_SUPABASE_URL: ${{ secrets.STRONGR_OS_SUPABASE_URL }}
          STRONGR_OS_SUPABASE_ANON_KEY: ${{ secrets.STRONGR_OS_SUPABASE_ANON_KEY }}
          STRONGR_OS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STRONGR_OS_SUPABASE_SERVICE_ROLE_KEY }}
          STRONGR_OS_DATABASE_URL: ${{ secrets.STRONGR_OS_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/acceptance/run_remote_supabase_acceptance.py \
            2>&1 | tee artifacts/m0-2-remote/remote-acceptance.jsonl

      - name: Run disposable backup and restore rehearsal
        env:
          STRONGR_OS_DATABASE_URL: ${{ secrets.STRONGR_OS_DATABASE_URL }}
          STRONGR_OS_RESTORE_DATABASE_URL: ${{ secrets.STRONGR_OS_RESTORE_DATABASE_URL }}
          STRONGR_OS_RESTORE_WORK_DIRECTORY: ${{ runner.temp }}/strongr-os-restore
        run: |
          set -euo pipefail
          scripts/acceptance/rehearse_backup_restore.sh \
            2>&1 | tee artifacts/m0-2-remote/backup-restore.jsonl

      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-2-remote-acceptance-${{ github.sha }}
          path: artifacts/m0-2-remote
          if-no-files-found: error
          retention-days: 30
